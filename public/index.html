<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Enhancer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Prompt Enhancer</h1>
        <p>Paste a rough prompt. Get back a clear, polished version of the same prompt, in the same language.</p>
      </header>

      <form id="form" class="panels">
        <section class="panel">
          <div class="panel-head">
            <label for="input">Your prompt</label>
            <span id="count" class="muted" aria-live="polite"></span>
          </div>
          <textarea
            id="input"
            dir="auto"
            spellcheck="true"
            placeholder="e.g. write email to students about class cancel tomorrow, make it polite"
            autofocus
          ></textarea>
          <div class="actions">
            <button id="enhance" type="submit" class="primary">Enhance prompt</button>
            <button id="clear" type="button">Clear</button>
            <span class="muted hint">Ctrl + Enter</span>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <label for="output">Enhanced prompt</label>
          </div>
          <textarea
            id="output"
            dir="auto"
            readonly
            placeholder="The enhanced prompt appears here."
          ></textarea>
          <div class="actions">
            <button id="copy" type="button" disabled>Copy</button>
            <button id="reuse" type="button" disabled>Use as input</button>
          </div>
        </section>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
